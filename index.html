<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFM2 Analyst</title>
<meta name="description" content="Save viewer, scouting, meta analysis and draft helper for Teamfight Manager 2. Runs fully in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314b8a6'/%3E%3Cpath d='M8 22l5-12 4 8 3-5 4 9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/home">TFM2 Analyst</a>
  <nav id="nav" hidden>
    <a href="#/home" data-route="home">Home</a>
    <a href="#/draft" data-route="draft">Draft</a>
    <a href="#/results" data-route="results">Results</a>
    <a href="#/meta" data-route="meta">Meta</a>
    <a href="#/scout" data-route="scout">Scouting</a>
    <a href="#/players" data-route="players">Players</a>
    <a href="#/teams" data-route="teams">Teams</a>
    <a href="#/games" data-route="games">Matches</a>
  </nav>
  <span class="spacer"></span>
  <span id="save-name" class="muted small"></span>
  <button class="ghost small" data-action="new-save" title="Open a different save">Open save</button>
</header>
<input type="file" id="file-input" accept=".data,.bak" hidden>
<main id="main"><p class="muted">Loading…</p></main>
<footer class="muted small">An unofficial fan tool. Not affiliated with Team Samoyed. Your save never leaves your browser.</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
